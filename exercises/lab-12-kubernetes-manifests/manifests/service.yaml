apiVersion: v1
kind: Service
metadata:
  name: lab12-nginx
  namespace: lab12
spec:
  selector:
    app: lab12-nginx    # Routes traffic to Pods whose labels match this selector
  ports:
    - port: 80          # Port the Service listens on (cluster-internal)
      targetPort: 80    # Port on the Pod/container to forward traffic to
  type: NodePort        # Exposes the Service on a static port on every node (30000-32767)
                        # In production on AWS/GCP/Azure, use LoadBalancer instead
